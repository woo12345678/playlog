name: Refresh game news

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:

concurrency:
  group: playlog-news-refresh
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout main release
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Capture immutable release SHA
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release
        run: npm test

  deploy-initial:
    needs: verify
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verified release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified static site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-initial
          path: .

      - name: Deploy verified site immediately
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-initial

  refresh:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    outputs:
      deploy-sha: ${{ steps.cache.outputs.sha }}
    steps:
      - name: Checkout verified catalog
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect public news and YouTube results
        run: npm run news:update -- --concurrency 4

      - name: Commit refreshed cache when changed
        id: cache
        run: |
          if git diff --quiet -- data/news.json; then
            echo "News cache is unchanged."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "playlog-news-bot"
          git config user.email "playlog-news-bot@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore(news): refresh public game feeds [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-refreshed:
    needs:
      - refresh
      - deploy-initial
    if: always() && needs.refresh.result == 'success' && (github.event_name == 'schedule' || needs.deploy-initial.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact refreshed release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.refresh.outputs.deploy-sha }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload refreshed static site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-refreshed
          path: .

      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-refreshed
