name: Refresh game news

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: playlog-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify catalog and feed parsers
        run: npm test

      - name: Collect public news and YouTube results
        run: npm run news:update -- --concurrency 4

      - name: Commit refreshed cache when changed
        run: |
          if git diff --quiet -- data/news.json; then
            echo "News cache is unchanged."
            exit 0
          fi
          git config user.name "playlog-news-bot"
          git config user.email "playlog-news-bot@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore(news): refresh public game feeds [skip ci]"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
